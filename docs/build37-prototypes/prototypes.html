<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StrideOS Build 37 Prototypes</title>
  <style>
    :root { --ink:#10100f; --raised:#1a1a18; --raised2:#24231f; --border:#34332e; --cream:#efe2cf; --sage:#929b83; --clay:#d7b99e; --muted:#aaa398; --white:#f7f2e9; --critical:#a45a50; }
    * { box-sizing:border-box; }
    body { margin:0; width:390px; height:844px; overflow:hidden; background:var(--ink); color:var(--white); font-family:-apple-system,BlinkMacSystemFont,"DM Sans",sans-serif; }
    .phone { width:390px; height:844px; padding:22px 18px 28px; background:radial-gradient(circle at 88% 0%,#27251f 0,transparent 32%),var(--ink); overflow:hidden; position:relative; }
    .status { display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin:0 4px 22px; }
    .eyebrow { color:var(--sage); font-size:11px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; }
    h1 { margin:5px 0 7px; font-family:"Cormorant Garamond",Georgia,serif; font-size:35px; line-height:1; font-weight:600; letter-spacing:-.5px; }
    h2 { margin:0 0 6px; font-family:"Cormorant Garamond",Georgia,serif; font-size:23px; font-weight:600; }
    h3 { margin:0; font-size:15px; }
    p { margin:0; color:var(--muted); font-size:13px; line-height:1.35; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
    .icon { width:44px; height:44px; border-radius:22px; display:grid; place-items:center; border:1px solid var(--border); background:var(--raised); font-size:18px; }
    .card { background:linear-gradient(145deg,var(--raised),#171715); border:1px solid var(--border); border-radius:22px; padding:16px; margin:10px 0; box-shadow:0 16px 34px rgba(0,0,0,.18); }
    .card.soft { background:var(--raised2); }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .stack { display:grid; gap:10px; }
    .divider { height:1px; background:var(--border); margin:12px 0; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; background:#2b2d26; color:var(--sage); font-size:11px; font-weight:800; }
    .pill.cream { background:#332d27; color:var(--cream); }
    .button { min-height:50px; display:flex; align-items:center; justify-content:center; border-radius:18px; background:var(--cream); color:#171511; font-size:15px; font-weight:850; margin-top:12px; }
    .button.secondary { background:var(--raised2); color:var(--white); border:1px solid var(--border); }
    .button.danger { background:#34201e; color:#efb4ac; border:1px solid #633632; }
    .field { min-height:54px; border-radius:15px; background:#121210; border:1px solid var(--border); padding:10px 13px; display:flex; align-items:center; justify-content:space-between; }
    .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.65px; font-weight:750; }
    .value { margin-top:4px; font-size:17px; font-weight:750; }
    .metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .metric { min-height:86px; border-radius:17px; background:#22221e; padding:13px; border:1px solid #303029; }
    .metric strong { display:block; color:var(--cream); font-size:22px; margin:8px 0 2px; }
    .toggle { width:48px; height:28px; padding:3px; background:var(--sage); border-radius:14px; display:flex; justify-content:flex-end; }
    .toggle:after { content:""; width:22px; height:22px; background:#111; border-radius:50%; }
    .wheel { height:242px; overflow:hidden; position:relative; text-align:center; padding-top:12px; }
    .wheel:before { content:""; position:absolute; left:0; right:0; top:95px; height:54px; background:#2d2d27; border-top:1px solid #4a493f; border-bottom:1px solid #4a493f; }
    .wheel div { height:46px; font-size:20px; color:#77736a; display:flex; align-items:center; justify-content:center; position:relative; }
    .wheel div.active { color:var(--white); font-size:29px; font-weight:800; }
    .sheet { position:absolute; left:0; right:0; bottom:0; padding:10px 18px 28px; background:#171715; border-radius:30px 30px 0 0; border-top:1px solid var(--border); box-shadow:0 -24px 60px rgba(0,0,0,.45); }
    .grab { width:42px; height:5px; background:#5a574f; border-radius:3px; margin:0 auto 18px; }
    .sheet-action { min-height:56px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #2b2a26; font-size:15px; font-weight:650; }
    .sheet-action span:first-child { width:31px; height:31px; display:grid; place-items:center; border-radius:10px; background:#292822; }
    .camera { height:430px; border-radius:24px; background:linear-gradient(180deg,#605d55,#302f2c 65%,#151513); position:relative; overflow:hidden; border:1px solid #5b5850; }
    .figure { position:absolute; left:156px; top:72px; width:44px; height:300px; border-radius:28px 28px 12px 12px; background:#171717; box-shadow:0 0 0 1px #777; }
    .marker { position:absolute; width:18px; height:18px; margin:-9px; border-radius:50%; background:var(--cream); border:3px solid #171717; box-shadow:0 0 0 2px var(--cream); }
    .line { position:absolute; height:4px; transform-origin:left center; background:var(--cream); border-radius:2px; }
    .timeline { height:48px; border-radius:14px; background:#25241f; margin-top:10px; position:relative; }
    .timeline:before { content:""; position:absolute; left:12px; right:12px; top:22px; height:3px; background:#4c4a42; }
    .timeline:after { content:""; position:absolute; left:41%; top:13px; width:4px; height:22px; background:var(--cream); border-radius:2px; }
    .progress { height:7px; background:#33332d; border-radius:4px; overflow:hidden; }
    .progress span { display:block; height:100%; background:var(--sage); }
    .small { font-size:12px; color:var(--muted); }
    .check { color:var(--sage); font-weight:900; }
    .nav { position:absolute; left:18px; right:18px; bottom:18px; height:62px; border-radius:23px; background:#1e1e1b; border:1px solid var(--border); display:flex; align-items:center; justify-content:space-around; color:#77736a; font-size:18px; }
    .nav .active { color:var(--cream); }
  </style>
</head>
<body><main class="phone" id="app"></main>
<script>
const q=new URLSearchParams(location.search); const screen=q.get('screen')||'route-actions';
const status='<div class="status"><span>9:41</span><span>●●●  5G  ◉</span></div>';
const head=(ey,title,sub,icon='×')=>`${status}<div class="top"><div><div class="eyebrow">${ey}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="icon">${icon}</div></div>`;
const toggle='<div class="toggle"></div>';
const screens={
'route-actions':`${head('Today’s run','River Loop','6.2 mi · Route attached','•••')}<div class="camera" style="height:440px;background:linear-gradient(145deg,#4e504a,#242622 60%,#161715)"><div style="position:absolute;inset:0;background:repeating-linear-gradient(24deg,transparent 0 48px,rgba(239,226,207,.08) 49px 51px)"></div><div style="position:absolute;left:40px;top:170px;width:310px;height:5px;background:#d7b99e;transform:rotate(-18deg);border-radius:5px"></div><div class="card" style="position:absolute;left:14px;right:14px;bottom:14px"><div class="label">Next segment</div><div class="row"><h3>Tempo mile · 0.42 mi away</h3><span>⌄</span></div></div></div><div class="sheet"><div class="grab"></div><h2>River Loop · 6.2 mi</h2><div class="sheet-action"><span>↗</span>View Route Details</div><div class="sheet-action"><span>⇄</span>Reverse Route</div><div class="sheet-action" style="color:#efb4ac"><span>−</span>Remove From Today’s Run</div><div class="button secondary">Cancel</div></div>`,
'save-route':`${head('Route builder','Save Route','Your route remains editable after saving','×')}<div class="card soft" style="height:290px;background:linear-gradient(145deg,#454941,#20241f)"><div style="margin:55px 25px;border-top:5px solid var(--clay);transform:rotate(12deg)"></div><div style="margin:80px 60px;border-top:5px solid var(--clay);transform:rotate(-20deg)"></div></div><div class="sheet" style="bottom:0"><div class="grab"></div><div class="label">Route name</div><div class="field" style="margin-top:8px;border-color:var(--cream);box-shadow:0 0 0 1px var(--cream)"><div class="value">Morning River Loop<span style="color:var(--cream)">│</span></div></div><div class="label" style="margin-top:13px">Notes · Optional</div><div class="field" style="margin-top:8px"><p>Easy loop with two tempo segments</p></div><p style="margin-top:9px">If left blank, StrideOS will use “Custom Route.”</p><div class="row"><div class="button secondary" style="flex:1">Cancel</div><div class="button" style="flex:1">Save Route</div></div></div>`,
'hydration-planner':`${head('Training run','Hydration & Fueling','Personalized starting targets—not a medical prescription','←')}<div class="card"><div class="row"><div><div class="label">Known athlete data</div><h3 style="margin-top:6px">Measured sweat rate available</h3></div><span class="pill">High confidence</span></div><div class="divider"></div><div class="row"><span>Carb tolerance · 65 g/hr</span><span>›</span></div><div class="divider"></div><div class="row"><span>Sweat sodium · 850 mg/L</span><span>ⓘ</span></div></div><div class="card"><div class="row"><div><div class="label">Run conditions</div><h3 style="margin-top:6px">10.00 mi · 90 min</h3></div><span class="pill cream">Live weather</span></div><p style="margin-top:8px">72°F · 58% humidity · Moderate effort</p><div class="button secondary">Recalculate Plan</div></div><div class="metric-grid"><div class="metric"><span class="label">Fluid</span><strong>18–24</strong><span class="small">oz/hr</span></div><div class="metric"><span class="label">Carbohydrate</span><strong>50–65</strong><span class="small">g/hr</span></div><div class="metric"><span class="label">Sodium intake</span><strong>500–750</strong><span class="small">mg/hr</span></div><div class="metric"><span class="label">Expected duration</span><strong>1:30</strong><span class="small">hours</span></div></div><div class="card"><div class="row"><h3>Execution</h3><span class="pill">6 hydration · 3 fuel cues</span></div><p style="margin-top:8px">Start with thirst and comfort. Adjust for conditions and GI response. This plan cannot guarantee symptom prevention.</p></div>`,
'hydration-voice':`${head('Voice reminders','Hydration cues','Separate timing and amount controls','←')}<div class="card"><div class="row"><div><h2>Hydration reminder</h2><p>Spoken and visual cue during an active run</p></div>${toggle}</div><div class="divider"></div><div class="field"><div><div class="label">Interval</div><div class="value">Every 15 minutes</div></div><span>›</span></div><div class="field" style="margin-top:10px"><div><div class="label">Approximate amount</div><div class="value">5 oz per reminder</div></div><span class="pill">Recommended</span></div><div class="button secondary">Test Voice</div></div><div class="card"><h3>What you’ll hear</h3><p style="color:var(--cream);font-size:17px;margin-top:10px">“Hydration reminder. Drink approximately five ounces.”</p></div><div class="card soft"><div class="row"><span>Visual cue remains available</span><span class="check">✓</span></div><p style="margin-top:7px">Speech is queued and simultaneous hydration/fuel cues are combined.</p></div>`,
'fuel-voice':`${head('Voice reminders','Fuel cues','Set independently from hydration','←')}<div class="card"><div class="row"><div><h2>Fuel reminder</h2><p>Spoken and visual carbohydrate cue</p></div>${toggle}</div><div class="divider"></div><div class="field"><div><div class="label">Interval</div><div class="value">Every 30 minutes</div></div><span>›</span></div><div class="field" style="margin-top:10px"><div><div class="label">Approximate amount</div><div class="value">25 g per reminder</div></div><span class="pill cream">Override</span></div><div class="button secondary">Use Recommended · 25 min</div><div class="button secondary">Test Voice</div></div><div class="card"><h3>What you’ll hear</h3><p style="color:var(--cream);font-size:17px;margin-top:10px">“Fuel reminder. Take approximately twenty-five grams of carbohydrate.”</p></div>`,
'hydration-wheel':`${head('Hydration interval','Every 15 minutes','Recommended for this plan','×')}<div class="card"><div class="wheel"><div>13 min</div><div>14 min</div><div class="active">15 min</div><div>16 min</div><div>17 min</div></div><div class="row"><div class="button secondary" style="flex:1">Cancel</div><div class="button" style="flex:1">Confirm</div></div></div><div class="card soft"><div class="row"><span>Approximate amount per cue</span><strong style="color:var(--cream)">5 oz</strong></div><p style="margin-top:8px">Choose any whole minute from 5–60.</p></div>`,
'fuel-wheel':`${head('Fuel interval','Every 30 minutes','You can return to the recommendation','×')}<div class="card"><div class="wheel"><div>28 min</div><div>29 min</div><div class="active">30 min</div><div>31 min</div><div>32 min</div></div><div class="row"><div class="button secondary" style="flex:1">Cancel</div><div class="button" style="flex:1">Confirm</div></div></div><div class="card soft"><div class="row"><span>Approximate carbohydrate</span><strong style="color:var(--cream)">25 g</strong></div><p style="margin-top:8px">Current established tolerance: 60 g/hr.</p></div>`,
'sweat-rate':`${head('Personalization','Measured Sweat Rate','Use a real session when possible','←')}<div class="card"><div class="stack"><div class="field"><div><div class="label">Pre-run weight</div><div class="value">170.0 lb</div></div><span>›</span></div><div class="field"><div><div class="label">Post-run weight</div><div class="value">168.8 lb</div></div><span>›</span></div><div class="row"><div class="field" style="flex:1"><div><div class="label">Fluid consumed</div><div class="value">16 oz</div></div></div><div class="field" style="flex:1"><div><div class="label">Urine output</div><div class="value">0 oz</div></div></div></div><div class="field"><div><div class="label">Duration</div><div class="value">60 min</div></div><span>›</span></div></div><div class="button">Calculate Sweat Rate</div></div><div class="card soft"><div class="label">Measured result</div><h1 style="font-size:42px;margin-top:10px">1.08 L/hr</h1><p>Approximate planning input. Repeat across conditions before treating it as typical.</p></div>`,
'carb-tolerance':`${head('Personalization','Carb Tolerance','Separate established tolerance from progression','←')}<div class="card"><div class="pill">Known tolerated amount</div><h2 style="margin-top:12px">60 g/hr</h2><p>Used as the established ceiling for today’s starting plan.</p><div class="divider"></div><div class="row"><span>Practical category</span><strong>Typical</strong></div><div class="divider"></div><div class="row"><span>Progression target</span><strong style="color:var(--cream)">70 g/hr</strong></div></div><div class="card soft"><h3>How StrideOS uses this</h3><p style="margin-top:8px">The current plan will not prescribe above 60 g/hr. A higher value is shown only as a gradual training target, not established tolerance.</p></div><div class="button">Save Tolerance</div><div class="button secondary">Not tested / Unknown</div>`,
'hip-flexion':`${head('Movement Lab','Anatomical Hip Flexion','Direct lateral · Right side closest','×')}<div class="camera"><div class="figure" style="transform:rotate(34deg);top:120px;height:260px"></div><div class="marker" style="left:181px;top:190px"></div><div class="marker" style="left:244px;top:284px"></div><div class="marker" style="left:184px;top:353px"></div><div class="line" style="left:181px;top:190px;width:112px;transform:rotate(56deg)"></div><div class="line" style="left:244px;top:284px;width:91px;transform:rotate(131deg)"></div><div class="pill" style="position:absolute;left:18px;bottom:18px">Closest chain only</div></div><div class="card"><div class="row"><div><div class="label">Hip Flexion</div><h1 style="font-size:44px">118° <small style="font:700 13px -apple-system">Estimated</small></h1></div><span class="pill">Confidence 86%</span></div><p>Estimated 2D anatomical flexion from visible trunk and femur landmarks. Neutral standing is approximately 0°.</p></div>`,
'hip-extension':`${head('Movement Lab','Anatomical Hip Extension','Direct lateral · Left side closest','×')}<div class="camera"><div class="figure" style="left:176px;top:76px;transform:rotate(-4deg)"></div><div class="marker" style="left:196px;top:176px"></div><div class="marker" style="left:174px;top:271px"></div><div class="marker" style="left:189px;top:353px"></div><div class="line" style="left:196px;top:176px;width:98px;transform:rotate(103deg)"></div><div class="line" style="left:174px;top:271px;width:84px;transform:rotate(80deg)"></div></div><div class="card"><div class="row"><div><div class="label">Hip Extension</div><h1 style="font-size:44px">9° <small style="font:700 13px -apple-system">Estimated</small></h1></div><span class="pill cream">Manual review</span></div><p>Extension is named directly. StrideOS never displays a negative hip-flexion value.</p></div>`,
'marker-edit':`${head('Adjust markers','Frame locked','Only measurement-relevant landmarks are editable','Cancel')}<div class="camera" style="height:500px"><div class="figure"></div><div class="marker" style="left:178px;top:133px"></div><div class="marker" style="left:178px;top:232px;background:var(--sage);box-shadow:0 0 0 6px rgba(146,155,131,.28)"></div><div class="marker" style="left:178px;top:314px"></div><div class="marker" style="left:178px;top:391px"></div><div class="line" style="left:178px;top:133px;width:99px;transform:rotate(90deg)"></div><div class="line" style="left:178px;top:232px;width:82px;transform:rotate(90deg)"></div><div class="line" style="left:178px;top:314px;width:77px;transform:rotate(90deg)"></div><div class="pill" style="position:absolute;right:14px;top:214px">Hip · active</div></div><div class="row"><div class="button secondary" style="flex:1">Reset Auto</div><div class="button" style="flex:1">Save</div></div><p style="text-align:center;margin-top:10px">Shoulder · Hip · Knee · Ankle · Right side</p>`,
'strength-chooser':`${head('Today’s strength','Choose Your Session','Both options remain available independently','←')}<div class="card"><span class="pill">Recommended</span><h2 style="margin-top:12px">Training Block Workout</h2><h3>Prehab & Resilience</h3><p style="margin-top:7px">Recommended from your current training block · 38 min</p><div class="button">Start Training Block Workout</div></div><div class="card"><span class="pill cream">Selected preset</span><h2 style="margin-top:12px">Preset Workout</h2><h3>Runner Strength — Gym Session</h3><p style="margin-top:7px">6 exercises · Barbell, rack, bench · 45 min</p><div class="button secondary">Start Runner Strength</div></div><div class="card soft"><div class="row"><span>One Live Activity at a time</span><span class="check">✓</span></div><p style="margin-top:7px">Starting another session always requires an explicit choice.</p></div>`,
'preset-detail':`${head('Preset workout','Runner Strength','Gym Session','←')}<div class="row"><span class="pill">45 min</span><span class="pill">6 exercises</span><span class="pill">2× weekly</span></div><div class="card"><h3>Why This Workout</h3><p style="margin-top:8px">Builds lower-body force, trunk control, and calf capacity that may support running performance.</p></div><div class="card"><div class="row"><div><div class="label">01 · Barbell</div><h3 style="margin-top:5px">Front Squat</h3><p>3 sets · 6 reps · RPE 7</p></div><span>›</span></div><div class="divider"></div><div class="row"><div><div class="label">02 · Dumbbells</div><h3 style="margin-top:5px">Single-Leg RDL</h3><p>3 sets · 8 / side</p></div><span>›</span></div><div class="divider"></div><div class="row"><div><div class="label">03 · Bench</div><h3 style="margin-top:5px">Step-Up</h3><p>3 sets · 8 / side</p></div><span>›</span></div></div><div class="button">Start Preset Workout</div>`,
'active-preset':`${head('Runner Strength','Front Squat','Exercise 1 of 6','•••')}<div class="row"><span class="pill">08:42 elapsed</span><span class="pill cream">Set 2 of 3</span></div><div class="card" style="margin-top:16px"><div class="label">Prescription</div><h1 style="font-size:48px">6 reps</h1><p>Barbell · RPE target 7 · Rest 2 minutes</p><div class="progress" style="margin-top:16px"><span style="width:28%"></span></div></div><div class="card"><h3>How to Perform</h3><p style="margin-top:8px">Keep the bar balanced over midfoot. Sit between the hips while maintaining a comfortable trunk position.</p><div class="divider"></div><h3>What It Should Feel Like</h3><p style="margin-top:8px">Strong leg effort with controlled breathing—not sharp pain.</p></div><div class="row"><div class="field" style="flex:1"><div><div class="label">RPE</div><div class="value">7</div></div><span>›</span></div><div class="field" style="flex:1"><div><div class="label">Load</div><div class="value">135 lb</div></div></div></div><div class="button">Complete Exercise</div>`,
'preset-completion':`${head('Workout complete','Strong work.','Runner Strength · 43:18','✓')}<div class="card"><div class="metric-grid"><div class="metric"><span class="label">Exercises</span><strong>6 / 6</strong><span class="small">completed</span></div><div class="metric"><span class="label">Volume</span><strong>7,840</strong><span class="small">lb estimated</span></div></div><div class="divider"></div><div class="row"><span>Session difficulty</span><span class="pill">Just Right</span></div></div><div class="card"><h3>Session reflection</h3><div class="row" style="margin-top:12px"><span class="pill cream">Too Easy</span><span class="pill" style="background:var(--sage);color:#111">Just Right</span><span class="pill cream">Too Hard</span></div><p style="margin-top:12px">Your feedback helps tune future recommendations without changing this preset.</p></div><div class="button">Save and Finish</div><div class="button secondary">Review Exercise Log</div>`,
'notification-settings':`${head('Settings','Notifications','Local reminders you control','←')}<div class="card"><div class="row"><div><h2>Morning Readiness Reminder</h2><p>Start the day with a brief readiness check</p></div>${toggle}</div><div class="divider"></div><div class="row"><div><div class="label">Time</div><div class="value">7:00 AM</div></div><span>›</span></div><div class="divider"></div><div class="row"><div><div class="label">Schedule</div><div class="value">Weekdays</div></div><span>›</span></div></div><div class="card"><div class="row"><div><h3>Workout reminders</h3><p>Upcoming Training Block or Preset sessions</p></div>${toggle}</div></div><div class="card soft"><div class="row"><span>Notification permission</span><span class="pill">Allowed</span></div><p style="margin-top:8px">If permission is denied, StrideOS links directly to iOS Settings.</p></div>`,
'morning-schedule':`${head('Morning reminder','7:00 AM','Scheduled in your local time','×')}<div class="card"><div class="wheel" style="height:196px"><div>6:45 AM</div><div>6:50 AM</div><div class="active">7:00 AM</div><div>7:05 AM</div></div></div><div class="card"><div class="label">Repeat</div><div class="row" style="margin-top:12px"><span class="pill">M</span><span class="pill">T</span><span class="pill">W</span><span class="pill">T</span><span class="pill">F</span><span class="pill cream">S</span><span class="pill cream">S</span></div><div class="divider"></div><div class="row"><span>Weekdays</span><span class="check">✓</span></div><div class="divider"></div><div class="row"><span>Daily</span><span></span></div><div class="divider"></div><div class="row"><span>Custom days</span><span>›</span></div></div><div class="row"><div class="button secondary" style="flex:1">Cancel</div><div class="button" style="flex:1">Save Schedule</div></div>`
};
document.getElementById('app').innerHTML=screens[screen]||screens['route-actions'];
</script></body></html>
